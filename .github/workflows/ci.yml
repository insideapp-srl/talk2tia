name: CI

on:
  push:
    branches: [main, pre-release]
  pull_request:
    branches: [main, pre-release]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (TIA Portal V21)
    # The Openness API is not redistributable: build and tests need a Windows runner
    # with TIA Portal V21 + Openness installed. Register it with the labels below.
    runs-on: [self-hosted, windows, x64, tia-v21]
    # Security: the repository is public. Never run code from fork pull requests on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      # The self-hosted runner already has the .NET 8 SDK (setup-dotnet cannot install without admin rights).
      - name: Check .NET SDK
        shell: powershell
        run: dotnet --list-sdks

      - name: Build
        run: dotnet build Talk2Tia.sln -c Release -nologo

      - name: Test
        run: dotnet test Talk2Tia.sln -c Release --no-build -nologo --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/

      - name: Build installer (smoke)
        shell: powershell
        run: |
          dotnet publish src/Talk2Tia.Server -c Release -o artifacts/publish -nologo
          dotnet build installer -c Release -p:Version=0.0.0 -nologo

  site:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
