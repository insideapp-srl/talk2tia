name: Release

# Push a tag like v0.1.0 to build, test, sign and publish the installers.
#
# Signing uses the InsideApp Certum certificate in Certum's cloud HSM (SimplySign).
# Before pushing the tag, log in to SimplySign Desktop on the self-hosted runner (e-mail + OTP
# from the SimplySign mobile app). No signing secret is stored on GitHub.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (e.g. 0.1.0)
        required: true
      allow_unsigned:
        description: Publish unsigned binaries if the certificate is unavailable (test releases only)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # redeploy the website after publishing

jobs:
  release:
    name: Build, sign & publish installers
    runs-on: [self-hosted, windows, x64, tia-v21]
    timeout-minutes: 45
    outputs:
      signed: ${{ steps.signing.outputs.enabled }}
    defaults:
      run:
        shell: powershell
    env:
      # Public thumbprint of the InsideApp code-signing certificate; override with the repository variable.
      SIGNING_CERT_SHA1: ${{ vars.SIGNING_CERT_SHA1 || '53D5FBADE305B0A3A7FB4D74CBBFCFCDC2735676' }}
    steps:
      - uses: actions/checkout@v4

      # The self-hosted runner already has the .NET 8 SDK (setup-dotnet cannot install without admin rights).
      - name: Check .NET SDK
        shell: powershell
        run: dotnet --list-sdks

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$v'" }
          "value=$v" >> $env:GITHUB_OUTPUT

      # Fail fast, before building, when SimplySign is not logged in on the runner.
      - name: Check signing certificate
        id: signing
        shell: powershell
        run: |
          try {
            ./build/sign.ps1 -Check
            "enabled=true" >> $env:GITHUB_OUTPUT
          }
          catch {
            if ("${{ inputs.allow_unsigned }}" -eq "true") {
              Write-Warning "Signing unavailable, continuing UNSIGNED: $($_.Exception.Message)"
              "enabled=false" >> $env:GITHUB_OUTPUT
            }
            else {
              throw
            }
          }

      - name: Test
        run: dotnet test Talk2Tia.sln -c Release -nologo -p:Version=${{ steps.version.outputs.value }}

      - name: Publish
        run: dotnet publish src/Talk2Tia.Server -c Release -o artifacts/publish -nologo -p:Version=${{ steps.version.outputs.value }}

      - name: Sign binaries
        if: steps.signing.outputs.enabled == 'true'
        shell: powershell
        run: ./build/sign.ps1 -Path artifacts/publish/talk2tia.exe, artifacts/publish/Talk2Tia.Core.dll

      - name: Build MSI
        run: dotnet build installer -c Release -nologo -p:Version=${{ steps.version.outputs.value }} -p:PublishDir=${{ github.workspace }}\artifacts\publish\

      - name: Sign MSI
        if: steps.signing.outputs.enabled == 'true'
        shell: powershell
        run: ./build/sign.ps1 -Path installer/bin/x64/Release/Talk2Tia-${{ steps.version.outputs.value }}-x64.msi -Description "Talk2Tia Setup"

      - name: Package
        shell: powershell
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "installer/bin/x64/Release/Talk2Tia-$v-x64.msi" dist/
          Get-ChildItem artifacts/publish -Exclude *.pdb | Compress-Archive -DestinationPath "dist/Talk2Tia-$v-x64-portable.zip"
          # Agent Skill for Claude Code / Claude Desktop (the zip contains the talk2tia folder).
          Compress-Archive -Path plugins/talk2tia/skills/talk2tia -DestinationPath dist/talk2tia-skill.zip
          # MCP Bundle for one-click install in Claude Desktop, and server.json for the MCP Registry (kept out of dist).
          ./build/mcpb.ps1 -Version $v -PublishDir artifacts/publish -OutDir dist
          Move-Item dist/server.json artifacts/server.json -Force
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - name: Keep server.json for the MCP Registry
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-json
          path: artifacts/server.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Talk2Tia ${{ steps.version.outputs.value }}
          generate_release_notes: true
          # 0.x versions were public betas; unsigned test builds are always pre-releases.
          prerelease: ${{ steps.signing.outputs.enabled != 'true' || startsWith(steps.version.outputs.value, '0.') }}
          files: dist/*

      # The website links the latest MSI directly (site/src/release.ts): rebuild it now that the release exists.
      # A release created with GITHUB_TOKEN does not trigger other workflows, but workflow_dispatch does.
      - name: Redeploy website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } `
            -Body '{"ref":"main"}' -ContentType 'application/json'
          Write-Host 'Website deployment requested.'

      # winget (winget install / upgrade InsideApp.Talk2Tia). Needs the WINGET_TOKEN secret: a classic GitHub token with
      # public_repo that can fork microsoft/winget-pkgs. Skipped without it; Microsoft reviews every pull request.
      - name: Submit to winget
        if: steps.signing.outputs.enabled == 'true'
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host 'WINGET_TOKEN not set: winget submission skipped.'; return }
          $v = '${{ steps.version.outputs.value }}'
          ./build/winget.ps1 -Version $v -Msi "dist/Talk2Tia-$v-x64.msi" -Submit

  # Official MCP Registry (registry.modelcontextprotocol.io): lists the .mcpb of this release under
  # io.github.insideapp-srl/talk2tia. GitHub OIDC proves the org namespace; no secret needed.
  registry:
    name: Publish to the MCP Registry
    needs: release
    if: needs.release.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mcp-server-json
      - name: Install mcp-publisher
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install mcp-publisher
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Publish
        run: |
          mcp-publisher validate
          mcp-publisher login github-oidc
          mcp-publisher publish
